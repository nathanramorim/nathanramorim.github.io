<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Ilustração do Forge SDD, uma ferramenta de linha de comando">
  <rect x="0" y="0" width="1200" height="750" rx="20" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1200" height="750" rx="20" fill="none" stroke="#e4e9f0" stroke-width="2"/>
  <rect x="0" y="0" width="1200" height="56" rx="20" fill="#ffffff"/>
  <rect x="0" y="36" width="1200" height="20" fill="#ffffff"/>
  <circle cx="34" cy="28" r="7" fill="#dc2626"/>
  <circle cx="58" cy="28" r="7" fill="#d97706"/>
  <circle cx="82" cy="28" r="7" fill="#16a34a"/>
  <rect x="120" y="18" width="280" height="20" rx="10" fill="#eef2f7"/>
  <text x="140" y="33" font-family="monospace" font-size="12" fill="#5b6675">forge-sdd init</text>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#e4e9f0" stroke-width="2"/>

  <rect x="24" y="80" width="1152" height="646" rx="14" fill="#0f172a"/>

  <text x="56" y="140" font-family="monospace" font-size="20" fill="#38bdf8">$ npx @nathanramorim/forge-sdd@latest init</text>
  <text x="56" y="180" font-family="monospace" font-size="18" fill="#94a3b8">✓ scaffolding sdd/memory, sdd/spec, sdd/features…</text>
  <text x="56" y="212" font-family="monospace" font-size="18" fill="#94a3b8">✓ .agent/commands/nova-feature.md</text>
  <text x="56" y="244" font-family="monospace" font-size="18" fill="#94a3b8">✓ .claude/commands/*.prompt.md</text>
  <text x="56" y="276" font-family="monospace" font-size="18" fill="#4ade80">✓ pronto — rode /discovery "sua ideia"</text>

  <rect x="56" y="330" width="1088" height="330" rx="12" fill="#111c33" stroke="#1e2b47" stroke-width="1.5"/>
  <text x="84" y="368" font-family="monospace" font-size="15" fill="#7dd3fc">sdd/FLOW.md</text>

  <g font-family="monospace" font-size="14" fill="#cbd5e1">
    <rect x="84" y="392" width="170" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="100" y="420">/discovery</text>

    <rect x="284" y="392" width="170" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="300" y="420">/split-features</text>

    <rect x="484" y="392" width="170" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="500" y="420">/nova-feature</text>

    <rect x="684" y="392" width="170" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="700" y="420">/proxima-feature</text>

    <rect x="884" y="392" width="170" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="915" y="420">/revisar</text>

    <path d="M254 415 H284 M454 415 H484 M654 415 H684 M854 415 H884" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <text x="84" y="480" font-family="monospace" font-size="14" fill="#64748b">progress.md ≤1KB · constitution.md ≤2KB · feat-XX.md ≤2KB</text>
  <text x="84" y="510" font-family="monospace" font-size="14" fill="#64748b">READ-MIN → PLAN → ACT → WRITE → CLOSE</text>

  <rect x="84" y="546" width="1024" height="80" rx="10" fill="#132313" stroke="#1f3a1f"/>
  <text x="104" y="578" font-family="monospace" font-size="15" fill="#4ade80">✓ 14/14 features · sessão registrada em .metrics/</text>
  <text x="104" y="604" font-family="monospace" font-size="13" fill="#86efac">Próximo comando sugerido: /discovery</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/>
    </marker>
  </defs>
</svg>
