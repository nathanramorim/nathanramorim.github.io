<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#f6f8fb" rx="12" />
  <rect x="1" y="1" width="798" height="418" rx="11" fill="none" stroke="#e4e9f0" stroke-width="1" />

  <text x="24" y="34" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="13" fill="#5b6675">espaco vetorial // cada ponto = 1 frase apos virar embedding</text>

  <!-- cluster: animais de estimação -->
  <g>
    <circle cx="180" cy="150" r="7" fill="#2563eb" />
    <circle cx="215" cy="175" r="7" fill="#2563eb" />
    <circle cx="160" cy="190" r="7" fill="#2563eb" />
    <line x1="180" y1="150" x2="215" y2="175" stroke="#bfd3f5" stroke-width="1.5" />
    <line x1="215" y1="175" x2="160" y2="190" stroke="#bfd3f5" stroke-width="1.5" />
    <line x1="160" y1="190" x2="180" y2="150" stroke="#bfd3f5" stroke-width="1.5" />
    <text x="120" y="110" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#0f172a">animais de estimação</text>
    <text x="120" y="130" font-family="Montserrat, sans-serif" font-size="12" fill="#5b6675">"cachorro" · "gato" · "veterinário"</text>
  </g>

  <!-- cluster: transporte -->
  <g>
    <circle cx="590" cy="120" r="7" fill="#1d4ed8" />
    <circle cx="630" cy="145" r="7" fill="#1d4ed8" />
    <circle cx="565" cy="155" r="7" fill="#1d4ed8" />
    <line x1="590" y1="120" x2="630" y2="145" stroke="#bfd3f5" stroke-width="1.5" />
    <line x1="630" y1="145" x2="565" y2="155" stroke="#bfd3f5" stroke-width="1.5" />
    <line x1="565" y1="155" x2="590" y2="120" stroke="#bfd3f5" stroke-width="1.5" />
    <text x="540" y="80" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#0f172a">transporte</text>
    <text x="540" y="100" font-family="Montserrat, sans-serif" font-size="12" fill="#5b6675">"carro" · "ônibus" · "estrada"</text>
  </g>

  <!-- cluster: culinária -->
  <g>
    <circle cx="370" cy="300" r="7" fill="#d97706" />
    <circle cx="410" cy="320" r="7" fill="#d97706" />
    <circle cx="350" cy="335" r="7" fill="#d97706" />
    <line x1="370" y1="300" x2="410" y2="320" stroke="#fde3b8" stroke-width="1.5" />
    <line x1="410" y1="320" x2="350" y2="335" stroke="#fde3b8" stroke-width="1.5" />
    <line x1="350" y1="335" x2="370" y2="300" stroke="#fde3b8" stroke-width="1.5" />
    <text x="310" y="380" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#0f172a">culinária</text>
    <text x="310" y="365" font-family="Montserrat, sans-serif" font-size="12" fill="#5b6675">"receita" · "tempero" · "forno"</text>
  </g>

  <!-- scattered noise points, far from every cluster -->
  <circle cx="470" cy="230" r="4" fill="#c7d2e0" />
  <circle cx="90" cy="280" r="4" fill="#c7d2e0" />
  <circle cx="700" cy="260" r="4" fill="#c7d2e0" />
  <circle cx="270" cy="60" r="4" fill="#c7d2e0" />
</svg>
