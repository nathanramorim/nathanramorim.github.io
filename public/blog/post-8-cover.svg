<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'Menlo', 'SF Mono', 'Consolas', monospace; }
      .body { font-family: 'Montserrat', -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#ffffff" />

  <!-- terminal chrome bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#f6f8fb" stroke="#e4e9f0" stroke-width="1" />
  <circle cx="30" cy="28" r="7" fill="#dc2626" />
  <circle cx="54" cy="28" r="7" fill="#d97706" />
  <circle cx="78" cy="28" r="7" fill="#1d4ed8" />
  <text x="110" y="34" class="mono" font-size="15" fill="#5b6675">blog/chatbots-erram-embeddings</text>

  <!-- vector space panel -->
  <rect x="60" y="96" width="520" height="440" rx="12" fill="#f6f8fb" stroke="#e4e9f0" stroke-width="1" />
  <text x="86" y="130" class="mono" font-size="13" fill="#5b6675">espaco vetorial // embeddings</text>

  <!-- cluster 1: pets -->
  <circle cx="180" cy="220" r="6" fill="#2563eb" />
  <circle cx="205" cy="245" r="6" fill="#2563eb" />
  <circle cx="165" cy="255" r="6" fill="#2563eb" />
  <text x="150" y="200" class="body" font-size="13" fill="#0f172a">pets</text>
  <line x1="180" y1="220" x2="205" y2="245" stroke="#bfd3f5" stroke-width="1.5" />
  <line x1="205" y1="245" x2="165" y2="255" stroke="#bfd3f5" stroke-width="1.5" />
  <line x1="165" y1="255" x2="180" y2="220" stroke="#bfd3f5" stroke-width="1.5" />

  <!-- cluster 2: transporte -->
  <circle cx="440" cy="180" r="6" fill="#1d4ed8" />
  <circle cx="470" cy="205" r="6" fill="#1d4ed8" />
  <circle cx="415" cy="210" r="6" fill="#1d4ed8" />
  <text x="480" y="170" class="body" font-size="13" fill="#0f172a">transporte</text>
  <line x1="440" y1="180" x2="470" y2="205" stroke="#bfd3f5" stroke-width="1.5" />
  <line x1="470" y1="205" x2="415" y2="210" stroke="#bfd3f5" stroke-width="1.5" />
  <line x1="415" y1="210" x2="440" y2="180" stroke="#bfd3f5" stroke-width="1.5" />

  <!-- cluster 3: culinaria -->
  <circle cx="280" cy="420" r="6" fill="#d97706" />
  <circle cx="315" cy="440" r="6" fill="#d97706" />
  <circle cx="260" cy="455" r="6" fill="#d97706" />
  <text x="330" y="450" class="body" font-size="13" fill="#0f172a">culinaria</text>
  <line x1="280" y1="420" x2="315" y2="440" stroke="#fde3b8" stroke-width="1.5" />
  <line x1="315" y1="440" x2="260" y2="455" stroke="#fde3b8" stroke-width="1.5" />
  <line x1="260" y1="455" x2="280" y2="420" stroke="#fde3b8" stroke-width="1.5" />

  <!-- scattered distant noise points -->
  <circle cx="500" cy="380" r="4" fill="#c7d2e0" />
  <circle cx="120" cy="380" r="4" fill="#c7d2e0" />
  <circle cx="380" cy="130" r="4" fill="#c7d2e0" />
  <circle cx="520" cy="480" r="4" fill="#c7d2e0" />

  <!-- text column -->
  <text x="630" y="180" class="mono" font-size="14" fill="#2563eb">módulo 1 · trilha de estudos</text>
  <text x="630" y="250" class="body" font-size="40" font-weight="800" fill="#0f172a">Chatbots erram.</text>
  <text x="630" y="300" class="body" font-size="40" font-weight="800" fill="#0f172a">A causa quase nunca</text>
  <text x="630" y="350" class="body" font-size="40" font-weight="800" fill="#0f172a">é a que você imagina</text>

  <text x="630" y="410" class="body" font-size="18" fill="#5b6675">O fundamento do RAG, explicado</text>
  <text x="630" y="436" class="body" font-size="18" fill="#5b6675">com código de exemplo no GitHub.</text>

  <text x="630" y="500" class="mono" font-size="15" fill="#1d4ed8">nathanramorim.github.io</text>
</svg>
